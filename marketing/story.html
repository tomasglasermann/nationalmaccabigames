<!doctype html><html><head><meta charset="utf-8"><style>
:root{--navy-800:#081d38;--navy-900:#061527;--burg:#800020;--burg4:#b83a54;}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden}
body{font-family:'Inter',sans-serif;color:#fff;position:relative;
 background:radial-gradient(1100px 800px at 80% 2%, rgba(128,0,32,.55), transparent 60%),
 radial-gradient(900px 700px at 0% 100%, rgba(28,58,102,.6), transparent 60%),
 linear-gradient(165deg,var(--navy-800),var(--navy-900));}
.stars{position:absolute;inset:0;opacity:.55;background-size:180px 156px;
 background-image:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='120'%20height='104'%3E%3Cg%20fill='none'%20stroke='%23ffffff'%20stroke-opacity='0.14'%20stroke-width='1.4'%20stroke-linejoin='round'%3E%3Cpolygon%20points='60,16 25,76 95,76'/%3E%3Cpolygon%20points='60,88 25,28 95,28'/%3E%3C/g%3E%3C/svg%3E");
 -webkit-mask:linear-gradient(#000 0%,rgba(0,0,0,.35) 55%,#000 100%)}
.wrap{position:absolute;inset:0;padding:0 84px;display:flex;flex-direction:column;align-items:center;text-align:center}
.partners{margin-top:200px;display:flex;align-items:center;gap:36px;opacity:.9}
.partners img{height:64px}.partners .sep{width:2px;height:56px;background:rgba(255,255,255,.3)}
.crest{position:relative;margin-top:44px;width:360px}
.crest img{width:100%;position:relative;filter:drop-shadow(0 30px 50px rgba(0,0,0,.55))}
.crest::before{content:"";position:absolute;inset:-40%;background:radial-gradient(circle,rgba(184,58,84,.6),transparent 60%);filter:blur(10px)}
.kicker{margin-top:40px;display:flex;align-items:center;gap:18px;color:var(--burg4);font-weight:800;font-size:26px;letter-spacing:.32em}
.kicker i{display:inline-block;width:20px;height:8px;transform:skewX(-25deg);background:#fff}.kicker i.r{background:var(--burg4)}
h1{margin-top:22px;font-weight:900;font-style:italic;font-size:150px;line-height:.9;letter-spacing:-.03em;text-transform:uppercase}
h1 .nmb{color:transparent;-webkit-text-stroke:4px var(--burg4)}
.sub{margin-top:28px;font-weight:900;font-style:italic;font-size:50px;text-transform:uppercase}
.sub b{color:var(--burg4)}
.tags{margin-top:34px;display:flex;flex-wrap:wrap;justify-content:center;gap:14px 16px}
.tag{font-weight:800;font-size:25px;letter-spacing:.06em;text-transform:uppercase;padding:14px 26px;border-radius:999px;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.18)}
.cta{margin-top:50px;font-weight:900;font-style:italic;font-size:62px;text-transform:uppercase;line-height:1}
.cta2{margin-top:16px;font-size:32px;font-weight:600;color:#d6ddea}
.arrow{margin-top:22px;font-size:54px;color:var(--burg4);animation:none}
.slot{margin-top:14px;width:640px;height:170px;border-radius:30px}
.guide .slot{border:4px dashed rgba(255,255,255,.55);display:grid;place-items:center;font-weight:800;font-size:26px;letter-spacing:.14em;color:rgba(255,255,255,.7)}
.foot{position:absolute;left:0;right:0;bottom:210px;display:flex;justify-content:center;gap:24px;font-weight:900;font-style:italic;font-size:30px;letter-spacing:.04em;text-transform:uppercase}
.foot span:nth-child(2){color:var(--burg4)}
.ribbon{position:absolute;left:0;right:0;bottom:0;height:14px;background:linear-gradient(90deg,var(--burg) 0 50%,#fff 50% 52%,var(--burg4) 52%)}
</style></head><body>
<div class="stars"></div>
<div class="wrap">
 <div class="partners"><img src="../public/assets/jccmaccabi-logo-white.webp"><span class="sep"></span><img src="../public/assets/marjcc-logo-white.webp"></div>
 <div class="crest"><img src="../public/assets/nmb-logo-white.webp"></div>
 <div class="kicker"><i></i><i class="r"></i>NORTH MIAMI BEACH<i class="r"></i><i></i></div>
 <h1>Let's go <span class="nmb">NMB!</span></h1>
 <div class="sub"><b>›</b> Road to Austin 2027</div>
 <div class="tags"><span class="tag">JCC Maccabi Games</span><span class="tag">Austin, TX</span><span class="tag">July 25–30, 2027</span></div>
 <div class="cta">Want to compete?</div>
 <div class="cta2">Athletes ages 13–17 · Tap the link if you're interested</div>
 <div class="arrow">▼</div>
 <div class="slot">LINK STICKER HERE</div>
</div>
<div class="foot"><span>#NMBtoAustin</span><span>·</span><span>Let's go NMB!</span></div>
<div class="ribbon"></div>
</body></html>
